name: GitHub Pages

# Baut das Spiel bei jedem Push auf main und veröffentlicht das Ergebnis
# (eine einzige index.html) auf GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment zur Zeit; neuere Läufe lösen ältere ab.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        # Playwright wird nur von den Werkzeugen gebraucht, nicht vom Build.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck und Build
        run: npm run build

      # Pages muss einmalig in den Repo-Einstellungen auf "GitHub Actions"
      # stehen; anlegen darf das Actions-Token die Site nicht.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
